name: Site

# Builds the site on every push and pull request; publishes it to GitHub Pages from main.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUGO_VERSION: "0.169.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The standard edition is enough: the site uses no Sass and no image processing.
      - name: Install Hugo
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
          hugo version

      # A warning (such as a deprecated setting) fails the build, and so does a {{< term >}} or
      # {{< idea >}} that names a page that does not exist.
      - name: Build
        run: hugo --gc --minify --panicOnWarning

      # The checkpoints are cut from the finished game, so rebuilding them must change nothing.
      - name: Check starter checkpoints
        run: |
          python3 tools/make-checkpoints.py
          git diff --exit-code -- starter/checkpoints

      # Quest step 1 links to this zip, served from the site itself.
      - name: Zip the starter kit
        run: tools/zip-starter.sh public

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
