baseURL = "https://inemtsev.github.io/klyph-web/"
locale = "en-us"
title = "klyph"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[params]
  description = "Learn to make 2D games in Kotlin with klyph, one small step at a time."
  engineRepo = "https://github.com/inemtsev/klyph"
  # The engine's own guide and API reference, and the repository to start a new game from.
  guide = "https://inemtsev.github.io/klyph/guide/index.html"
  apiReference = "https://inemtsev.github.io/klyph/"
  template = "https://github.com/inemtsev/klyph-template"
  # The klyph version the site and the starter teach.
  version = "1.0.0"

[markup]
  [markup.goldmark.renderer]
    # Lets pages use a little raw HTML, such as <kbd> for keys.
    unsafe = true
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2

[menus]
  [[menus.main]]
    name = "Quest"
    pageRef = "/quest"
    weight = 10
  [[menus.main]]
    name = "Big Ideas"
    pageRef = "/ideas"
    weight = 20
  [[menus.main]]
    name = "Game Words"
    pageRef = "/words"
    weight = 30
  [[menus.main]]
    name = "Cheat Sheet"
    pageRef = "/cheat-sheet"
    weight = 40

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]
